<html lang="es">

    <title>Acobijando la Comunidad - Donación de Ropa</title>
    <style>
        :root {
            --primary: #1d4ed8;       /* Azul brillante */
            --secondary: #1e3a8a;     /* Azul oscuro */

            --bg-main: #f0f4f8;       /* Fondo gris azulado muy suave */
            --bg-card: #ffffff;
            --text-dark: #1e293b;
            --text-light: #475569;
            --border: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background-color: var(--secondary);
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

            text-align: center;
            padding: 5rem 1rem;
        }

            font-size: 2.5rem;
            margin-bottom: 1rem;
